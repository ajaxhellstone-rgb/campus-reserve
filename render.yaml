databases:
  - name: campus-reserve-demo-db
    databaseName: campus_reserve
    user: campus_reserve
    plan: free
    region: singapore
    postgresMajorVersion: "16"

services:
  - type: web
    name: campus-reserve-demo
    runtime: docker
    plan: free
    region: singapore
    branch: main
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /up
    envVars:
      - key: APP_ENV
        value: production
      - key: APP_DEBUG
        value: "false"
      - key: APP_KEY
        generateValue: true
      - key: APP_URL
        value: https://campus-reserve-demo.onrender.com
      - key: LOG_CHANNEL
        value: stderr
      - key: DB_CONNECTION
        value: pgsql
      - key: DB_HOST
        fromDatabase:
          name: campus-reserve-demo-db
          property: host
      - key: DB_PORT
        value: "5432"
      - key: DB_DATABASE
        fromDatabase:
          name: campus-reserve-demo-db
          property: database
      - key: DB_USERNAME
        fromDatabase:
          name: campus-reserve-demo-db
          property: user
      - key: DB_PASSWORD
        fromDatabase:
          name: campus-reserve-demo-db
          property: password
      - key: SESSION_DRIVER
        value: database
      - key: SESSION_SECURE_COOKIE
        value: "true"
      - key: CACHE_STORE
        value: database
      - key: QUEUE_CONNECTION
        value: database
      - key: MAIL_MAILER
        value: log
